services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radmeasure
      POSTGRES_USER: radmeasure
      POSTGRES_PASSWORD: radmeasure-local
    volumes:
      - radmeasure-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radmeasure -d radmeasure"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: radmeasure-local
      MINIO_ROOT_PASSWORD: radmeasure-local-secret
    volumes:
      - radmeasure-minio:/data
    ports:
      - "127.0.0.1:9001:9001"

  orthanc:
    image: orthancteam/orthanc:latest
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__NAME: RadMeasure Research PACS
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"radmeasure":"radmeasure-local"}'
      ORTHANC__DICOM_WEB__ROOT: /dicom-web/
      ORTHANC__HTTP_SERVER_ENABLED: "true"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__HTTP_HEADERS: '{"Access-Control-Allow-Origin":"http://127.0.0.1:3000","Access-Control-Allow-Credentials":"true","Access-Control-Allow-Headers":"Authorization,Content-Type","Access-Control-Allow-Methods":"GET,POST,PUT,DELETE,OPTIONS"}'
    volumes:
      - radmeasure-orthanc:/var/lib/orthanc/db
    ports:
      - "127.0.0.1:8042:8042"
      - "127.0.0.1:4242:4242"

  ohif:
    image: ohif/app:latest
    volumes:
      - ./config/ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - orthanc

  api:
    build: .
    environment:
      RADMEASURE_EVAL_REPLAY: "0"
      RADMEASURE_DEMO_MODE: "1"
      RADMEASURE_PROVIDER_CREDENTIAL_DIR: /credentials
      RADMEASURE_VLM_PROFILES: ${RADMEASURE_VLM_PROFILES:-}
      RADMEASURE_VLM_URL: ${RADMEASURE_VLM_URL:-}
      RADMEASURE_VLM_MODEL: ${RADMEASURE_VLM_MODEL:-}
      RADMEASURE_VLM_API_KEY: ${RADMEASURE_VLM_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RADMEASURE_DATABASE_URL: postgresql://radmeasure:radmeasure-local@postgres:5432/radmeasure
      RADMEASURE_S3_ENDPOINT: http://minio:9000
      RADMEASURE_S3_BUCKET: radmeasure-artifacts
      RADMEASURE_S3_ACCESS_KEY: radmeasure-local
      RADMEASURE_S3_SECRET_KEY: radmeasure-local-secret
      RADMEASURE_API_KEYS: '{"viewer-local":{"name":"local-viewer","role":"viewer"},"operator-local":{"name":"local-operator","role":"operator"},"reviewer-local":{"name":"local-reviewer","role":"admin"}}'
      RADMEASURE_ORTHANC_URL: http://orthanc:8042
      RADMEASURE_ORTHANC_USERNAME: radmeasure
      RADMEASURE_ORTHANC_PASSWORD: radmeasure-local
    volumes:
      - radmeasure-provider-credentials:/credentials
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure

  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    command: ["uvicorn", "radmeasure.inference_api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      RADMEASURE_INFERENCE_TOKEN: inference-local-secret
      RADMEASURE_LANDMARK_CHECKPOINT: /models/hrnet_lm.pt
      RADMEASURE_MODEL_DEVICE: cpu
      RADMEASURE_S3_ENDPOINT: http://minio:9000
      RADMEASURE_S3_ACCESS_KEY: radmeasure-local
      RADMEASURE_S3_SECRET_KEY: radmeasure-local-secret
    volumes:
      - "${RADMEASURE_LANDMARK_CHECKPOINT:-./models/hrnet_lm.pt}:/models/hrnet_lm.pt:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  worker:
    build: .
    command: ["radmeasure-worker", "--poll-seconds", "0.25"]
    environment:
      RADMEASURE_EVAL_REPLAY: "0"
      RADMEASURE_DEMO_MODE: "1"
      RADMEASURE_PROVIDER_CREDENTIAL_DIR: /credentials
      RADMEASURE_VLM_PROFILES: ${RADMEASURE_VLM_PROFILES:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RADMEASURE_DATABASE_URL: postgresql://radmeasure:radmeasure-local@postgres:5432/radmeasure
      RADMEASURE_INFERENCE_URL: http://inference:8100
      RADMEASURE_INFERENCE_TOKEN: inference-local-secret
      RADMEASURE_VLM_URL: ${RADMEASURE_VLM_URL:-}
      RADMEASURE_VLM_MODEL: ${RADMEASURE_VLM_MODEL:-}
      RADMEASURE_VLM_API_KEY: ${RADMEASURE_VLM_API_KEY:-}
      RADMEASURE_DISCREPANCY_POLICY: ${RADMEASURE_DISCREPANCY_POLICY:-}
      RADMEASURE_S3_ENDPOINT: http://minio:9000
      RADMEASURE_S3_ACCESS_KEY: radmeasure-local
      RADMEASURE_S3_SECRET_KEY: radmeasure-local-secret
    volumes:
      - radmeasure-provider-credentials:/credentials
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      disable: true
    deploy:
      replicas: 2

volumes:
  radmeasure-provider-credentials:
  radmeasure-postgres:
  radmeasure-minio:
  radmeasure-orthanc:
