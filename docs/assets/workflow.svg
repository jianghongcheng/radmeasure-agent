<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="935" viewBox="0 0 1000 935" role="img" aria-labelledby="title desc">
<title id="title">radmeasure-agent workflow</title><desc id="desc">Agent execution paths with explicit repair, stop, and review decisions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52677c"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#20364b} .label{font-weight:700;font-size:17px} .edge{fill:none;stroke:#52677c;stroke-width:2;marker-end:url(#arrow)} .node{fill:#f0f5fa;stroke:#9aafc3;stroke-width:1.5} .keep{fill:#eaf7f0;stroke:#70ad8e} .repair{fill:#fff5e5;stroke:#c9a45f} .stop{fill:#fcefed;stroke:#c89991}</style>
<rect width="1000" height="935" rx="12" fill="#fff"/>
<path class="edge" d="M320 102V132"/>
<path class="edge" d="M320 208V238"/>
<path class="edge" d="M320 314V344"/>
<path class="edge" d="M320 420V455"/>
<path class="edge" d="M245 490H140V550"/>
<path class="edge" d="M320 525V550"/>
<path class="edge" d="M395 490H500V550"/>
<path class="edge" d="M45 598H24V382H155"/>
<path class="edge" d="M330 647V760"/>
<path class="edge" d="M500 647V712H410V760"/>
<path class="edge" d="M485 170H585V598H575"/>
<path class="edge" d="M800 208V278"/>
<path class="edge" d="M800 375V550"/>
<path class="edge" d="M800 647V807H565"/>
<g><rect class="node" x="155" y="26" width="330" height="76" rx="10"/><text x="320" y="53" text-anchor="middle" class="label">Measurement request</text><text x="320" y="77" text-anchor="middle">Registered-case analysis</text></g>
<g><rect class="node" x="155" y="132" width="330" height="76" rx="10"/><text x="320" y="159" text-anchor="middle" class="label">Constrained planner</text><text x="320" y="183" text-anchor="middle">Select registered protocols and tools</text></g>
<g><rect class="node" x="155" y="238" width="330" height="76" rx="10"/><text x="320" y="265" text-anchor="middle" class="label">Measurement tools</text><text x="320" y="289" text-anchor="middle">Produce HVA / IMA angles</text></g>
<g><rect class="node" x="155" y="344" width="330" height="76" rx="10"/><text x="320" y="371" text-anchor="middle" class="label">Verification</text><text x="320" y="395" text-anchor="middle">Validate outputs and geometry</text></g>
<polygon points="320,455 395,490 320,525 245,490" fill="#eaf0fb" stroke="#9aafc3" stroke-width="1.5"/><text x="320" y="496" text-anchor="middle" class="label">Route</text>
<g><rect class="node repair" x="45" y="550" width="190" height="97" rx="10"/><text x="140" y="577" text-anchor="middle" class="label">REPAIR</text><text x="140" y="601" text-anchor="middle">Eligible proposal</text><text x="140" y="622" text-anchor="middle">Budget remaining</text></g>
<g><rect class="node keep" x="245" y="550" width="170" height="97" rx="10"/><text x="330" y="577" text-anchor="middle" class="label">KEEP</text><text x="330" y="601" text-anchor="middle">Checks passed</text><text x="330" y="622" text-anchor="middle">Retain measurement</text></g>
<g><rect class="node stop" x="425" y="550" width="150" height="97" rx="10"/><text x="500" y="577" text-anchor="middle" class="label">STOP</text><text x="500" y="601" text-anchor="middle">Invalid / denied</text><text x="500" y="622" text-anchor="middle">Repair unavailable</text></g>
<g><rect class="node" x="650" y="132" width="300" height="76" rx="10"/><text x="800" y="159" text-anchor="middle" class="label">Uploaded radiograph</text><text x="800" y="183" text-anchor="middle">Separate image-inference path</text></g>
<g><rect class="node" x="650" y="278" width="300" height="97" rx="10"/><text x="800" y="305" text-anchor="middle" class="label">Configured image model</text><text x="800" y="329" text-anchor="middle">Compatible weights required</text><text x="800" y="350" text-anchor="middle">Optional correction proposal</text></g>
<g><rect class="node repair" x="650" y="550" width="300" height="97" rx="10"/><text x="800" y="577" text-anchor="middle" class="label">Human review</text><text x="800" y="601" text-anchor="middle">Required for all upload results</text><text x="800" y="622" text-anchor="middle">Approve, reject, or correct</text></g>
<g><rect class="node" x="175" y="760" width="390" height="97" rx="10"/><text x="370" y="787" text-anchor="middle" class="label">Measurement + execution record</text><text x="370" y="811" text-anchor="middle">Persist outcomes, decisions, and review history</text></g>
<text x="320" y="905" text-anchor="middle">Repair requires an independent proposal and policy eligibility.</text>
</svg>
