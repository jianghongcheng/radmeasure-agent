[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radmeasure"
version = "0.5.0"
description = "Medical imaging measurement agent with registered HVA/IMA protocols and auditable review"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "python-multipart>=0.0.9,<1"]
mcp = []
ml = ["numpy>=1.24"]
inference = ["torch>=2.4,<3", "torchvision>=0.19,<1", "Pillow>=10,<12", "pydicom>=3,<4"]
dev = [
  "pytest>=8",
  "numpy>=1.24",
  "Pillow>=10,<12",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "torch>=2.4,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.9,<1",
]
prod = ["psycopg[binary]>=3.2,<4", "boto3>=1.35,<2", "pydicom>=3,<4"]

[project.scripts]
radmeasure = "radmeasure.cli:main"
radmeasure-mcp = "radmeasure.mcp_server:main"
radmeasure-worker = "radmeasure.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
